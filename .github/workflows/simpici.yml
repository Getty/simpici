name: SimpiCI

on:
  workflow_call:
    inputs:
      provider:
        description: >-
          Whitespace-separated list of pinned, org-owned provider image refs.
          Each is run once to generate additional .cicd job files; the
          repository's own .cicd jobs win any name collision.
        required: false
        type: string
        default: ""
      concurrency:
        description: >-
          Maximum jobs to run at once within a phase (default 2). SimpiCI runs a
          whole matrix as containers inside one runner job, so raise this only if
          the runner can take it.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      provider:
        description: Whitespace-separated pinned provider image refs
        required: false
        type: string
        default: ""
      concurrency:
        description: Max jobs run at once within a phase (default 2)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Getty/simpici/action@main
        env:
          CICD_REGISTRY: ghcr.io
          CICD_REGISTRY_USER: ${{ github.actor }}
          CICD_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          CICD_IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          CICD_PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' }}
          SIMPICI_PROVIDERS: ${{ inputs.provider }}
          SIMPICI_CONCURRENCY: ${{ inputs.concurrency }}
