services:
  traefik:
    image: docker.io/library/traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8080
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Containerfile.web
    volumes:
      - ./var/public/runs:/usr/share/nginx/html/runs:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.simpici.rule: PathPrefix(`/`)
      traefik.http.routers.simpici.entrypoints: web
      traefik.http.services.simpici.loadbalancer.server.port: "80"
    restart: unless-stopped

